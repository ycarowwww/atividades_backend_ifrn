{% extends "base.html" %}
{% load static %}
{% block title %}Início{% endblock %}
{% block styles %}
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}
{% block content %}
    <div id="content">
        <div class="container">
            <form method="post" enctype="multipart/form-data" action="/produto/create">
                {% csrf_token %}
                <div class="row">
                    <!--<input type="hidden" value="{{produto.id}}" name="id">-->
                    <h5 for="Produto" class="col-md-2">Produto</h5>
                    <input name="Produto">
                </div>
                <div class="row">
                    <div class="col-md-2">
                        <input type="checkbox" name="destaque">
                        <label for="destaque">Destaque</label>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-2">
                        <input type="checkbox" name="promocao">
                        <label for="promocao">Promoção</label>
                    </div>
                </div>
                <div class="row">
                    <label for="msgPromocao" class="col-md-2">Msg Promoção</label>
                    <input name="msgPromocao">
                </div>
                <div class="row mt-2">
                    <label for="preco" class="col-md-2">Preço</label>
                    <input name="preco">
                </div>
                <div class="row mt-2">
                    <label for="image" class="col-md-2">Imagem</label>
                    <input id="image"
                           type="file"
                           name="image"
                           accept="image/*"
                           onchange="previewImage(this, 'image-preview')">
                </div>
                <div class="row mt-3">
                    <img id="image-preview"
                         class="border border-secondary image-preview-hidden"
                         width="200px"
                         alt="Preview da imagem" />
                </div>
                <div class="row mt-2">
                    <label for="CategoriaFk" class="col-md-2">Categoria</label>
                    <select name="CategoriaFk" class="select-box">
                        <option value="-1">-----</option>
                        {% for cate in categorias %}
                            <option value="{{ cate.id }}">{{ cate.Categoria }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="row mt-2">
                    <label for="FabricanteFk" class="col-md-2">Fabricante</label>
                    <select name="FabricanteFk" class="select-box">
                        <option value="-1">-----</option>
                        {% for fabri in fabricantes %}
                            <option value="{{ fabri.id }}">{{ fabri.Fabricante }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="row">
                    <button type="submit" class="btn btn-danger col-md-2 mt-3 mr-2"><i class="fa fa-check"></i> Inserir</button>
                    <a href="{% url 'produto' %}" class="btn bg-secondary col-md-2 mt-3"><i class="fa fa-rotate-left"></i> Retornar</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
{% block scripts %}
    <script src="{% static 'js/home.js' %}"></script>
    <script>
        function previewImage(input, previewId) {
            const preview = document.getElementById(previewId);
            const file = input.files[0];

            if (!file) {
                preview.removeAttribute('src');
                preview.style.display = 'none';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                preview.src = event.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    </script>
{% endblock %}
